# desk-kindl configuration. Panel commands run with this directory as cwd.
# Each panel's text is whatever its command prints (stdout + stderr).
# Start output with a line "#markup" to use Pango markup (<b>, <i>, <big>...).

kindle = true          # set false when testing on a desktop
font = Sans
columns = 1
orientation = portrait   # portrait | landscape | auto (follow screen shape)
show_titles = false     # small headings above each panel
clock_size = 190
title_size = 12
body_size = 20
clock_format = %H:%M
date_format = %A, %-d %B
timezone = Europe/Dublin   # IANA timezone, shared by the clock and agenda
full_refresh = 900     # seconds between full-window repaints (0 = off)

[panel TODAY]
command = sh scripts/calendar.sh
interval = 60

[panel WEATHER]
command = sh scripts/weather.sh
interval = 1800

[panel TRANSIT]
command = sh scripts/transit.sh
interval = 120

# Optional panel: add [panel Home server] with command = sh scripts/server.sh.
