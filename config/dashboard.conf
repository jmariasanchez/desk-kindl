# desk-kindl configuration. Panel commands run with this directory as cwd.
# Each panel's text is whatever its command prints (stdout + stderr).
# Start output with a line "#markup" to use Pango markup (<b>, <i>, <big>...).

kindle = true          # set false when testing on a desktop
font = Sans
columns = 2
clock_size = 56
title_size = 16
body_size = 13
clock_format = %H:%M
date_format = %A, %d %B
full_refresh = 900     # seconds between full e-ink flashes (0 = off)

[panel Calendar]
command = sh scripts/calendar.sh
interval = 900
span = 2

[panel Weather]
command = sh scripts/weather.sh
interval = 1800

[panel Transit]
command = sh scripts/transit.sh
interval = 120

[panel GitHub builds]
command = sh scripts/github.sh
interval = 300

[panel Home server]
command = sh scripts/server.sh
interval = 120
