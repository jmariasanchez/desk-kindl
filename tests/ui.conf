kindle = false
timezone = Europe/Dublin
font = Sans
clock_size = 140
title_size = 12
body_size = 18
date_format = %A, %-d %B
columns = 2
full_refresh = 0

[panel TODAY]
command = printf '#markup\n<small>NEXT · 11:00 · in 30 min</small>\n<big><b>Design review</b></big>\n\n<b>14:00</b>  Project check-in\n\n<b>17:30</b>  Dinner with friends\n\n<small>ALL DAY</small>  Autumn break\n<small>Synced 4 min ago</small>'
span = 2

[panel WEATHER]
command = printf 'Dublin\nPartly cloudy\n12°C · feels 10°C\nWind 12 km/h\nHumidity 78%%\nRain 0.2 mm'

[panel TRANSIT]
command = printf '11:08  46A · City centre\n11:16  145 · Heuston'
